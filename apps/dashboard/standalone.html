<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LATCH Timeline</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#111;background:#f6f7f8}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:28px 18px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:11px;align-items:center}.mark{width:42px;height:42px;display:grid;place-items:center;background:#111;color:#fff;border-radius:12px;font-weight:900;font-size:20px}h1{font-size:20px;margin:0}.sub{color:#6b7280;font-size:13px;margin:2px 0 0}.connect{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:13px;margin:22px 0;display:grid;grid-template-columns:1fr auto;gap:8px}.connect input{padding:10px;border:1px solid #d1d5db;border-radius:8px}.connect p{grid-column:1/-1;margin:0;font-size:11px;color:#6b7280}button{border:0;border-radius:9px;background:#111;color:#fff;padding:10px 12px;font-weight:700;cursor:pointer}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.filters button{background:#e6e7e9;color:#333;font-size:11px}.filters button.active{background:#111;color:#fff}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid #e1e3e6;border-radius:14px;padding:15px 17px}.row{display:flex;justify-content:space-between;gap:12px}.row h2{font-size:16px;margin:0}.risk{font-size:10px;font-weight:850;padding:4px 7px;border-radius:99px;background:#dcfce7;height:max-content}.MEDIUM .risk{background:#fef3c7}.HIGH .risk,.CRITICAL .risk{background:#fee2e2}.meta{font-size:11px;color:#747982}.facts{display:flex;gap:8px;flex-wrap:wrap}.facts span{font-size:11px;background:#f3f4f6;padding:6px 8px;border-radius:7px}ul{font-size:12px;line-height:1.5}.warn{background:#fff1f2;color:#9f1239;border-radius:8px;padding:8px 10px;font-size:12px}.empty{text-align:center;color:#777;padding:70px 10px}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:9px;margin:10px 0}details{font-size:11px;margin-top:10px}pre{background:#111;color:#eee;overflow:auto;padding:10px;border-radius:8px}@media(max-width:650px){.connect{grid-template-columns:1fr}.connect p{grid-column:auto}}
</style></head><body><main><header><div class="brand"><div class="mark">L</div><div><h1>LATCH</h1><p class="sub">Digital action timeline</p></div></div><button id="refresh">Refresh</button></header><section class="connect"><input id="token" type="password" placeholder="Device token"><button id="connect">Connect</button><p>The token stays in this browser's local storage. When opened from the LATCH extension, it is transferred in the URL fragment and removed immediately.</p></section><div id="error"></div><div id="filters" class="filters"></div><section id="list" class="list"></section></main><script>
const tokenEl=document.querySelector('#token'),listEl=document.querySelector('#list'),errorEl=document.querySelector('#error'),filters=document.querySelector('#filters');let all=[],filter='ALL';
const hash=new URLSearchParams(location.hash.replace(/^#/,''));if(hash.get('token')){localStorage.setItem('latchToken',hash.get('token'));history.replaceState(null,'',location.pathname+location.search)}tokenEl.value=localStorage.getItem('latchToken')||'';
function drawFilters(){filters.innerHTML='';for(const x of ['ALL','LOW','MEDIUM','HIGH','CRITICAL']){const b=document.createElement('button');b.textContent=x;b.className=filter===x?'active':'';b.onclick=()=>{filter=x;drawFilters();render()};filters.append(b)}}
function render(){listEl.innerHTML='';const xs=all.filter(r=>filter==='ALL'||r.manifest.risk===filter);if(!xs.length){listEl.innerHTML='<div class="empty">No actions found.</div>';return}for(const r of xs){const a=document.createElement('article');a.className='item '+r.manifest.risk;const host=new URL(r.source.url).hostname;a.innerHTML='<div class="row"><h2></h2><span class="risk"></span></div><p class="meta"></p><div class="facts"></div><ul></ul><div class="warnings"></div><details><summary>Receipt JSON</summary><pre></pre></details>';a.querySelector('h2').textContent=r.manifest.summary;a.querySelector('.risk').textContent=r.manifest.risk;a.querySelector('.meta').textContent=new Date(r.createdAt).toLocaleString()+' · '+host+' · '+r.status;const facts=a.querySelector('.facts');for(const [k,v] of [['Reversibility',r.manifest.reversibility],['Confidence',Math.round(r.manifest.confidence*100)+'%'],['Type',r.manifest.actionType]]){const s=document.createElement('span');s.textContent=k+': '+v;facts.append(s)}const ul=a.querySelector('ul');for(const e of r.manifest.effects||[]){const li=document.createElement('li');li.textContent=e;ul.append(li)}const w=a.querySelector('.warnings');for(const msg of r.manifest.warnings||[]){const p=document.createElement('p');p.className='warn';p.textContent='⚠ '+msg;w.append(p)}a.querySelector('pre').textContent=JSON.stringify(r,null,2);listEl.append(a)}}
async function load(){errorEl.innerHTML='';const token=tokenEl.value.trim();if(!token){all=[];render();return}localStorage.setItem('latchToken',token);try{const r=await fetch('/v1/receipts?limit=200',{headers:{authorization:'Bearer '+token}});if(!r.ok)throw new Error('API '+r.status);all=(await r.json()).receipts;render()}catch(e){errorEl.innerHTML='<div class="error"></div>';errorEl.firstChild.textContent=String(e)}}
document.querySelector('#connect').onclick=load;document.querySelector('#refresh').onclick=load;drawFilters();if(tokenEl.value)load();
</script></body></html>

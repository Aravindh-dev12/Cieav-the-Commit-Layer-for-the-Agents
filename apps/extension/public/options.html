<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LATCH Settings</title><link rel="stylesheet" href="ui.css"></head><body class="options"><main><header><div class="logo">L</div><div><strong>LATCH Settings</strong><small>Security and connectivity</small></div></header><section class="card"><h2>Backend</h2><label>API URL<input id="apiBase" placeholder="http://localhost:8787"></label><p class="hint">The extension registers an anonymous device token. Raw form values, passwords and card numbers are never sent by the extension.</p></section><section class="card"><h2>Protection behavior</h2><label class="switch-row"><span>Protect consequential actions</span><input id="enabled" type="checkbox"></label><label class="switch-row"><span>Record cancelled previews</span><input id="recordCancelled" type="checkbox"></label><label>Intervention level<select id="interventionLevel"><option value="balanced">Balanced — consequential actions</option><option value="high-only">High risk only</option><option value="strict">Strict — every detected candidate</option></select></label><label class="switch-row"><span>Local-only mode</span><input id="localOnly" type="checkbox"></label><p class="hint">Local-only mode disables backend/model analysis and uses deterministic on-device classification.</p></section><div class="actions"><button id="save">Save settings</button><span id="saved"></span></div></main><script src="options.js"></script></body></html>

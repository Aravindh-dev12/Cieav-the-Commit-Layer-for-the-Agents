[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cieav-platform"
version = "0.7.0"
description = "CIEAV always-on commit infrastructure for consequential digital actions."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "CIEAV"}]
dependencies = []

[project.optional-dependencies]
hf = ["huggingface_hub>=0.34,<2"]

[project.scripts]
cieav = "latch_platform.__main__:entrypoint"
latch = "latch_platform.__main__:entrypoint"
cieav-mcp = "latch_platform.mcp_launcher:main"
cieav-approval = "latch_platform.approval_cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["latch_platform*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "latch-platform"
version = "0.7.0"
description = "Always-on local commit infrastructure for consequential digital actions."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "LATCH"}]
dependencies = []

[project.optional-dependencies]
hf = ["huggingface_hub>=0.34,<2"]

[project.scripts]
latch = "latch_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["latch_platform*"]

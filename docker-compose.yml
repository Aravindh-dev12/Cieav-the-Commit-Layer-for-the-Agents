services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: latch
      POSTGRES_PASSWORD: latch
      POSTGRES_DB: latch
    ports: ["5432:5432"]
    volumes: ["latch_pg:/var/lib/postgresql/data"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on: [postgres]
    ports: ["8787:8787"]
volumes:
  latch_pg:

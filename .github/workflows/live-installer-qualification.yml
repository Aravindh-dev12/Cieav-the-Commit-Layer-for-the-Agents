name: live-installer-qualification

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful release-runtime run ID for this exact main commit
        required: true
        type: string
      scenario:
        description: Live installer qualification scenario
        required: true
        default: success
        type: choice
        options:
          - success
          - rollback
      rollback_cloud_outage_confirmed:
        description: For rollback only, confirm the installer-pinned Cloud endpoint is intentionally unavailable after CDN verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: live-installer-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: verify-release-source-self-hosted
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Require explicit rollback outage confirmation
        if: ${{ inputs.scenario == 'rollback' }}
        shell: bash
        run: test '${{ inputs.rollback_cloud_outage_confirmed }}' = 'true' || { echo 'Rollback qualification requires an operator-controlled outage of the pinned Cloud endpoint after real HTTPS CDN verification'; exit 2; }
      - name: Verify exact successful release source run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$RUNNER_TEMP/release-run.json"
          node - "$RUNNER_TEMP/release-run.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const fail=m=>{console.error(m);process.exit(2)};
          if(r.conclusion!=='success') fail('release source run is not successful');
          if(r.head_sha!==process.env.GITHUB_SHA) fail(`release source run head ${r.head_sha} != qualification head ${process.env.GITHUB_SHA}`);
          if(r.path!=='.github/workflows/release-runtime.yml') fail(`unexpected source workflow: ${r.path}`);
          NODE

  live-installer-linux:
    name: live-installer-linux-x64
    needs: verify-source
    runs-on: [self-hosted, linux, x64, cieav-release-hardware, cieav-live-installer]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact signed publish layout
        uses: actions/download-artifact@v4
        with:
          name: cieav-cdn-publish-layout
          path: publish
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
      - name: Require rendered installer bytes
        shell: node {0}
        run: |
          const fs=require('fs');
          const p='publish/install.sh';
          if(!fs.existsSync(p)) throw new Error(`missing ${p}`);
          const s=fs.readFileSync(p,'utf8');
          if(/__CIEAV_DOWNLOAD_BASE_URL__|__CIEAV_RELEASE_VERSION__|__CIEAV_RELEASE_KEY_ID__/.test(s)) throw new Error('installer is not fully rendered');
      - name: Exercise real HTTPS installer transaction
        run: python scripts/installer-live-smoke.py --installer publish/install.sh --scenario '${{ inputs.scenario }}' --mode publish --confirm-install-mutation
      - name: Upload live installer evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-installer-${{ inputs.scenario }}-linux-x64
          path: release/reports/cieav-installer-${{ inputs.scenario }}-*.json
          if-no-files-found: error
      - name: Scrub qualification worktree
        if: ${{ always() }}
        run: |
          git reset --hard HEAD
          git clean -ffdx

  live-installer-windows:
    name: live-installer-windows-x64
    needs: verify-source
    runs-on: [self-hosted, windows, x64, cieav-release-hardware, cieav-live-installer]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact signed publish layout
        uses: actions/download-artifact@v4
        with:
          name: cieav-cdn-publish-layout
          path: publish
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
      - name: Require rendered installer bytes
        shell: node {0}
        run: |
          const fs=require('fs');
          const p='publish/install.ps1';
          if(!fs.existsSync(p)) throw new Error(`missing ${p}`);
          const s=fs.readFileSync(p,'utf8');
          if(/__CIEAV_DOWNLOAD_BASE_URL__|__CIEAV_RELEASE_VERSION__|__CIEAV_RELEASE_KEY_ID__/.test(s)) throw new Error('installer is not fully rendered');
      - name: Exercise real HTTPS installer transaction
        run: python scripts/installer-live-smoke.py --installer publish/install.ps1 --scenario '${{ inputs.scenario }}' --mode publish --confirm-install-mutation
      - name: Upload live installer evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-installer-${{ inputs.scenario }}-windows-x64
          path: release/reports/cieav-installer-${{ inputs.scenario }}-*.json
          if-no-files-found: error
      - name: Scrub qualification worktree
        if: ${{ always() }}
        run: |
          git reset --hard HEAD
          git clean -ffdx

  live-installer-macos:
    name: live-installer-macos-arm64
    needs: verify-source
    runs-on: [self-hosted, macos, arm64, cieav-release-hardware, cieav-live-installer]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact signed publish layout
        uses: actions/download-artifact@v4
        with:
          name: cieav-cdn-publish-layout
          path: publish
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
      - name: Require rendered installer bytes
        shell: node {0}
        run: |
          const fs=require('fs');
          const p='publish/install.sh';
          if(!fs.existsSync(p)) throw new Error(`missing ${p}`);
          const s=fs.readFileSync(p,'utf8');
          if(/__CIEAV_DOWNLOAD_BASE_URL__|__CIEAV_RELEASE_VERSION__|__CIEAV_RELEASE_KEY_ID__/.test(s)) throw new Error('installer is not fully rendered');
      - name: Exercise real HTTPS installer transaction
        run: python scripts/installer-live-smoke.py --installer publish/install.sh --scenario '${{ inputs.scenario }}' --mode publish --confirm-install-mutation
      - name: Upload live installer evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-installer-${{ inputs.scenario }}-macos-arm64
          path: release/reports/cieav-installer-${{ inputs.scenario }}-*.json
          if-no-files-found: error
      - name: Scrub qualification worktree
        if: ${{ always() }}
        run: |
          git reset --hard HEAD
          git clean -ffdx

name: managed-learning-qualification

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/src/managed-learning-providers.ts'
      - 'apps/api/src/managed-learning-providers.test.ts'
      - 'apps/api/src/learning-job-queue.ts'
      - 'packages/core/src/provider-runtime.ts'
      - 'packages/contracts/src/provider-runtime.ts'
      - 'scripts/managed-learning-static.mjs'
      - 'scripts/qualify-managed-learning.mjs'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/managed-learning-qualification.yml'
  pull_request:
    paths:
      - 'apps/api/src/managed-learning-providers.ts'
      - 'apps/api/src/managed-learning-providers.test.ts'
      - 'apps/api/src/learning-job-queue.ts'
      - 'packages/core/src/provider-runtime.ts'
      - 'packages/contracts/src/provider-runtime.ts'
      - 'scripts/managed-learning-static.mjs'
      - 'scripts/qualify-managed-learning.mjs'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/managed-learning-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-offline:
    name: managed-learning-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Qualify managed learning contracts offline
        run: node scripts/qualify-managed-learning.mjs

      - name: Verify exact-head zero-authority receipt
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const p='release/reports/latest-managed-learning-qualification.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(r.verdict!=='PASS') throw new Error('managed-learning receipt is not PASS');
          if(r.commit!==head) throw new Error(`receipt commit ${r.commit} != HEAD ${head}`);
          if(r.mode!=='OFFLINE') throw new Error('hosted CI managed-learning gate must be OFFLINE without provider credentials');
          if(r.authority!==false||r.productionAuthority!==false||r.mayMintExecutionAuthority!==false||r.mayPromoteModel!==false||r.candidateQualified!==false||r.promotionExecuted!==false) throw new Error('managed-learning authority invariant failed');
          console.log(`Managed learning qualified ${process.platform}/${process.arch} at ${head}`);

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-learning-${{ matrix.name }}-${{ github.sha }}
          path: |
            release/reports/latest-managed-learning-qualification.json
            release/reports/latest-managed-learning-qualification.txt
          if-no-files-found: error
          retention-days: 30

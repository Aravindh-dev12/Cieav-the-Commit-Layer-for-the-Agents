name: intent-reality-core
on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'production/**'
  pull_request:
permissions:
  contents: read
jobs:
  cross-platform-intent-reality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm install
      - name: Build local authority runtime
        run: npm run build:api
      - name: Typecheck intent-to-reality packages
        run: |
          npm run typecheck -w @cieav/contracts
          npm run typecheck -w @cieav/core
          npm run typecheck -w @cieav/api
      - name: Verify Reality-Bound Commit and autonomy invariants
        run: npm run test -w @cieav/core -- intent-reality.test.ts
      - name: Verify durable quarantine and restart behavior
        run: npm run test -w @cieav/api -- intent-reality.test.ts
      - name: Verify platform control-plane package
        run: |
          python -m pip install -e .
          python -m compileall -q python
          python -m cieav_platform --help

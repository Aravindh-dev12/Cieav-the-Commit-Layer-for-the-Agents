name: intent-reality-cross-platform
on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'production/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: intent-reality-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intent-reality:
    name: Intent-to-Reality · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify OS-backed root secret boundary
        run: node scripts/os-secret-root-release.mjs
      - name: Verify OpenClaw zero-dependency consumer boundary
        run: node scripts/openclaw-no-deps-static.mjs
      - name: Parse Windows consumer installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content -Raw 'distribution/install.ps1')) | Out-Null"
      - name: Parse Unix consumer installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n distribution/install.sh
          if grep -Eqi 'npm install|npx |pip install|pnpm add|yarn add' distribution/install.sh; then echo 'Unix consumer installer must not require package managers'; exit 1; fi
      - name: Verify Windows TPM/CNG native provider boundary
        run: node scripts/windows-tpm-cng-release.mjs
      - name: Verify live Windows TPM/MAA collector boundary
        run: node scripts/windows-tpm-maa-collector-release.mjs
      - name: Verify macOS Secure Enclave native provider boundary
        run: node scripts/macos-secure-enclave-release.mjs
      - name: Verify Linux PKCS11 native provider boundary
        run: node scripts/linux-pkcs11-release.mjs
      - name: Install workspaces
        run: npm ci
      - name: Verify Linux TPM2 attestation foundation
        run: node scripts/linux-tpm2-attestation-release.mjs
      - name: Build local authority packages
        run: npm run build:api
      - name: Verify Python-Node RLVR boundary
        run: python scripts/ml-python-node-smoke.py
      - name: Verify RLVR rollout evaluation and mining
        run: python scripts/ml-rollout-eval-smoke.py
      - name: Verify RLVR curriculum mixing and fresh-rollout contract
        run: python scripts/ml-curriculum-smoke.py
      - name: Verify invariant reroll feedback into active mining
        run: python scripts/ml-invariant-feedback-smoke.py
      - name: Verify ML training round provenance and promotion binding
        run: python scripts/ml-training-round-smoke.py
      - name: Verify signed qualified-checkpoint release binding
        run: node scripts/ml-release-binding-smoke.mjs
      - name: Verify ML reproducibility and completion contracts
        run: python scripts/ml-reproducibility-smoke.py
      - name: Verify physical qualification preflight contract
        run: node scripts/physical-qualification-preflight-smoke.mjs
      - name: Verify physical qualification evidence contract
        run: node scripts/physical-qualification-evidence-smoke.mjs
      - name: Verify physical evidence provenance policy
        run: node scripts/physical-provenance-smoke.mjs
      - name: Verify private managed secret bootstrap
        run: node scripts/managed-secret-pipe-release.mjs
      - name: Verify Gateway credential and hardware lifecycle
        run: node scripts/credential-hardware-admin-release.mjs
      - name: Verify Intent-to-Reality production invariants
        run: node scripts/intent-reality-release.mjs
      - name: Verify trusted downstream execution adapters
        run: node scripts/trusted-execution-adapters-release.mjs
      - name: Verify full Agent Kernel regression gate
        run: node scripts/agent-kernel-release.mjs

name: self-hosted-full-ci

on:
  push:
    branches:
      - feat/trusted-tool-consequence-contract
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: CIEAV full Linux qualification
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180
    env:
      CI: "true"
      CIEAV_PHYSICAL_HARDWARE_QUALIFICATION: ""
      PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          id
          pwd
          df -h
          free -h || true
          node --version || true
          npm --version || true
          python3 --version || true
          google-chrome --version || chromium --version || chromium-browser --version || true
          git --version

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure runner system Python
        shell: bash
        run: |
          set -euxo pipefail
          PYTHON_BIN="$(command -v python3 || command -v python)"
          "$PYTHON_BIN" --version
          mkdir -p "$RUNNER_TEMP/cieav-bin"
          ln -sf "$PYTHON_BIN" "$RUNNER_TEMP/cieav-bin/python"
          echo "$RUNNER_TEMP/cieav-bin" >> "$GITHUB_PATH"
          PYTHONPATH="$GITHUB_WORKSPACE/python:$GITHUB_WORKSPACE" "$PYTHON_BIN" -m cieav_platform --help >/dev/null
          PYTHONPATH="$GITHUB_WORKSPACE/python:$GITHUB_WORKSPACE" "$PYTHON_BIN" -m cieav_platform kernel --help >/dev/null

      - name: Reality Kernel CLI qualification
        shell: bash
        run: |
          set -euxo pipefail
          python -m unittest discover -s python/tests -p 'test_*.py' -v

      - name: Install Node dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Core qualification
        run: npm run test:core

      - name: M6 evidence quorum qualification
        run: |
          npx vitest run packages/core/src/consequence-algebra-evidence-quorum.test.ts
          npx vitest run apps/api/src/consequence-algebra-evidence-quorum.test.ts apps/api/src/execution-fabric-evidence-quorum.test.ts

      - name: M12 browser commit-point qualification
        run: node scripts/browser-commit-point-e2e.mjs

      - name: Agent Kernel qualification tests
        run: npm run test:agent-kernel

      - name: Authority state qualification
        run: npm run test:authority-state

      - name: Authority transaction qualification
        run: npm run test:authority-transactions

      - name: AI orchestration qualification
        run: npm run test:ai-orchestration

      - name: Static and production boundaries
        run: npm run test:boundaries

      - name: Full CIEAV test suite
        run: npm test

      - name: Current-platform release qualification
        run: npm run release:qualify:current

      - name: Repository governance qualification
        run: npm run release:qualify:governance

      - name: Production qualification
        run: npm run release:qualify:production

      - name: Release verification plan
        run: npm run release:verify:plan

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cieav-self-hosted-linux-${{ github.sha }}
          path: |
            release/reports/**
            artifacts/**
          if-no-files-found: ignore
          retention-days: 30

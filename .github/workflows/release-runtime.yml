name: release-runtime

on:
  workflow_dispatch:
    inputs:
      cloud_url:
        description: HTTPS CIEAV Cloud Intelligence base URL
        required: false
        type: string
      download_base_url:
        description: HTTPS public CIEAV download/CDN base URL
        required: false
        type: string
      channel:
        description: Release channel
        required: true
        default: stable
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_PFX_B64: ${{ secrets.CIEAV_WINDOWS_CODE_SIGN_PFX_B64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.CIEAV_WINDOWS_CODE_SIGN_PFX_PASSWORD }}
      WINDOWS_CERT_THUMBPRINT: ${{ vars.CIEAV_WINDOWS_CODE_SIGN_THUMBPRINT }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.CIEAV_WINDOWS_TIMESTAMP_URL }}
      MACOS_CERT_P12_B64: ${{ secrets.CIEAV_MACOS_DEVELOPER_ID_P12_B64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.CIEAV_MACOS_DEVELOPER_ID_P12_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ vars.CIEAV_MACOS_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY_B64: ${{ secrets.CIEAV_APPLE_NOTARY_KEY_B64 }}
      APPLE_NOTARY_KEY_ID: ${{ vars.CIEAV_APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ vars.CIEAV_APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        shell: bash
        run: |
          npm install
          npm install --no-save esbuild
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Bundle semantic bridge
        shell: bash
        run: |
          mkdir -p apps/api/dist
          npx esbuild apps/api/src/server.ts --bundle --platform=node --format=esm --target=node22 --external:pg-native --outfile=apps/api/dist/server.js
      - name: Build standalone CIEAV executable
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name cieav --paths python python/latch_platform/__main__.py
      - name: Authenticode sign and verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_PFX_B64 -or -not $env:WINDOWS_PFX_PASSWORD -or -not $env:WINDOWS_CERT_THUMBPRINT -or -not $env:WINDOWS_TIMESTAMP_URL) { throw 'Windows production signing configuration is incomplete' }
          $pfx = Join-Path $env:RUNNER_TEMP 'cieav-code-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD /tr $env:WINDOWS_TIMESTAMP_URL /td SHA256 dist/cieav.exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
          & $signtool.FullName verify /pa /all /v dist/cieav.exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed' }
          $sig = Get-AuthenticodeSignature dist/cieav.exe
          if ($sig.Status -ne 'Valid') { throw "Authenticode status is $($sig.Status)" }
          $actual = ($sig.SignerCertificate.Thumbprint -replace '\s','').ToUpperInvariant()
          $expected = ($env:WINDOWS_CERT_THUMBPRINT -replace '\s','').ToUpperInvariant()
          if ($actual -ne $expected) { throw 'Windows signer certificate thumbprint mismatch' }
          Remove-Item -Force $pfx
      - name: Developer ID sign and verify macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -n "$MACOS_CERT_P12_B64" || { echo 'Missing CIEAV_MACOS_DEVELOPER_ID_P12_B64'; exit 2; }
          test -n "$MACOS_CERT_PASSWORD" || { echo 'Missing CIEAV_MACOS_DEVELOPER_ID_P12_PASSWORD'; exit 2; }
          test -n "$MACOS_SIGNING_IDENTITY" || { echo 'Missing CIEAV_MACOS_SIGNING_IDENTITY'; exit 2; }
          KEYCHAIN="$RUNNER_TEMP/cieav-signing.keychain-db"
          CERT="$RUNNER_TEMP/cieav-developer-id.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERT_P12_B64" | base64 -D > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" dist/cieav
          codesign --verify --strict --verbose=2 dist/cieav
          codesign -dv --verbose=4 dist/cieav 2>&1 | grep -F "Authority=$MACOS_SIGNING_IDENTITY"
          rm -f "$CERT"
      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          KEY=$(python -c 'import platform; s={"Darwin":"macos","Windows":"windows","Linux":"linux"}[platform.system()]; m=platform.machine().lower(); a="arm64" if m in {"arm64","aarch64"} else "x64" if m in {"x86_64","amd64"} else m; print(f"{s}-{a}")')
          NODE_EXE=$(node -p 'process.execPath')
          if [ -f dist/cieav.exe ]; then CIEAV_EXE=dist/cieav.exe; else CIEAV_EXE=dist/cieav; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "node_exe=$NODE_EXE" >> "$GITHUB_OUTPUT"
          echo "cieav_exe=$CIEAV_EXE" >> "$GITHUB_OUTPUT"
      - name: Assemble runtime archive
        shell: bash
        run: |
          python scripts/build-release-runtime.py --cieav-exe '${{ steps.identity.outputs.cieav_exe }}' --node-exe '${{ steps.identity.outputs.node_exe }}' --version '${{ steps.identity.outputs.version }}' --output-dir release-out
      - name: Notarize macOS runtime archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -n "$APPLE_NOTARY_KEY_B64" || { echo 'Missing CIEAV_APPLE_NOTARY_KEY_B64'; exit 2; }
          test -n "$APPLE_NOTARY_KEY_ID" || { echo 'Missing CIEAV_APPLE_NOTARY_KEY_ID'; exit 2; }
          test -n "$APPLE_NOTARY_ISSUER" || { echo 'Missing CIEAV_APPLE_NOTARY_ISSUER'; exit 2; }
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_B64" | base64 -D > "$NOTARY_KEY"
          chmod 0600 "$NOTARY_KEY"
          ARCHIVE=$(find release-out -maxdepth 1 -name 'cieav-runtime-*-macos-*.zip' -print -quit)
          test -n "$ARCHIVE" || { echo 'macOS runtime archive missing'; exit 2; }
          xcrun notarytool submit "$ARCHIVE" --key "$NOTARY_KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --wait --timeout 30m
          rm -f "$NOTARY_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ steps.identity.outputs.key }}
          path: release-out/*
          if-no-files-found: error

  publish-layout:
    needs: build-runtime
    runs-on: ubuntu-latest
    env:
      CLOUD_URL: ${{ inputs.cloud_url || vars.CIEAV_CLOUD_URL || vars.LATCH_CLOUD_URL }}
      DOWNLOAD_BASE_URL: ${{ inputs.download_base_url || vars.CIEAV_DOWNLOAD_BASE_URL || vars.LATCH_DOWNLOAD_BASE_URL }}
      CHANNEL: ${{ inputs.channel || 'stable' }}
      WINDOWS_SIGNER_THUMBPRINT: ${{ vars.CIEAV_WINDOWS_CODE_SIGN_THUMBPRINT }}
      MACOS_SIGNING_IDENTITY: ${{ vars.CIEAV_MACOS_SIGNING_IDENTITY }}
      RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.CIEAV_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
      RELEASE_SIGNING_PUBLIC_KEY_B64: ${{ vars.CIEAV_RELEASE_SIGNING_PUBLIC_KEY_B64 }}
      RELEASE_SIGNING_KEY_ID: ${{ vars.CIEAV_RELEASE_SIGNING_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: release-out
          merge-multiple: true
      - name: Generate verified installer metadata
        shell: bash
        run: |
          test -n "$CLOUD_URL" || { echo 'Set cloud_url or repository variable CIEAV_CLOUD_URL'; exit 2; }
          test -n "$DOWNLOAD_BASE_URL" || { echo 'Set download_base_url or repository variable CIEAV_DOWNLOAD_BASE_URL'; exit 2; }
          test -n "$WINDOWS_SIGNER_THUMBPRINT" || { echo 'Set CIEAV_WINDOWS_CODE_SIGN_THUMBPRINT'; exit 2; }
          test -n "$MACOS_SIGNING_IDENTITY" || { echo 'Set CIEAV_MACOS_SIGNING_IDENTITY'; exit 2; }
          case "$CLOUD_URL" in https://*) ;; *) echo 'Cloud URL must use HTTPS'; exit 2;; esac
          case "$DOWNLOAD_BASE_URL" in https://*) ;; *) echo 'Download base URL must use HTTPS'; exit 2;; esac
          VERSION=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          python scripts/make-release-manifest.py --input-dir release-out --output release-out/manifest.json --version "$VERSION" --cloud-url "$CLOUD_URL" --channel "$CHANNEL"
          test -n "$(find release-out -maxdepth 1 -name 'bootstrap-*.txt' -print -quit)" || { echo 'No bootstrap metadata generated'; exit 2; }
      - name: Sign release metadata with offline trust root
        shell: bash
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY_B64" || { echo 'Missing secret CIEAV_RELEASE_SIGNING_PRIVATE_KEY_B64'; exit 2; }
          test -n "$RELEASE_SIGNING_PUBLIC_KEY_B64" || { echo 'Missing variable CIEAV_RELEASE_SIGNING_PUBLIC_KEY_B64'; exit 2; }
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY_B64" | base64 -d > "$RUNNER_TEMP/cieav-release-private.pem"
          printf '%s' "$RELEASE_SIGNING_PUBLIC_KEY_B64" | base64 -d > release-out/release-public-key.pem
          chmod 0600 "$RUNNER_TEMP/cieav-release-private.pem"
          mapfile -t META < <(find release-out -maxdepth 1 -type f \( -name 'manifest.json' -o -name 'bootstrap-*.txt' \) -print | sort)
          node scripts/release-sign.mjs sign --private-key "$RUNNER_TEMP/cieav-release-private.pem" --public-key release-out/release-public-key.pem --output-dir release-out/signatures "${META[@]}" > "$RUNNER_TEMP/sign-result.json"
          node scripts/release-sign.mjs verify --public-key release-out/release-public-key.pem --output-dir release-out/signatures "${META[@]}"
          ACTUAL_KEY_ID=$(node -e 'const fs=require("fs"),c=require("crypto");const k=c.createPublicKey(fs.readFileSync(process.argv[1]));process.stdout.write(c.createHash("sha256").update(k.export({type:"spki",format:"der"})).digest("hex"))' release-out/release-public-key.pem)
          test -n "$RELEASE_SIGNING_KEY_ID" || { echo 'Missing variable CIEAV_RELEASE_SIGNING_KEY_ID'; exit 2; }
          test "$ACTUAL_KEY_ID" = "$RELEASE_SIGNING_KEY_ID" || { echo 'Configured release signing key ID does not match public key'; exit 2; }
          rm -f "$RUNNER_TEMP/cieav-release-private.pem"
      - name: Build CDN publish layout
        shell: bash
        run: |
          mkdir -p "publish/$CHANNEL/signatures"
          python scripts/render-installers.py --download-base-url "$DOWNLOAD_BASE_URL" --windows-signer-thumbprint "$WINDOWS_SIGNER_THUMBPRINT" --macos-signing-identity "$MACOS_SIGNING_IDENTITY" --output-dir publish
          cp release-out/manifest.json "publish/$CHANNEL/manifest.json"
          cp release-out/bootstrap-*.txt "publish/$CHANNEL/"
          cp release-out/cieav-runtime-*.zip "publish/$CHANNEL/"
          cp release-out/release-public-key.pem "publish/$CHANNEL/release-public-key.pem"
          cp release-out/signatures/*.sig.json "publish/$CHANNEL/signatures/"
          chmod 0755 publish/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cieav-cdn-publish-layout
          path: publish/**
          if-no-files-found: error
      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "CIEAV $TAG" --notes "CIEAV runtime release. Public installer distribution should be served from the configured CIEAV download CDN."
          gh release upload "$TAG" publish/install.ps1 publish/install.sh "publish/$CHANNEL/manifest.json" "publish/$CHANNEL/release-public-key.pem" publish/$CHANNEL/bootstrap-*.txt publish/$CHANNEL/signatures/*.sig.json publish/$CHANNEL/cieav-runtime-*.zip --clobber

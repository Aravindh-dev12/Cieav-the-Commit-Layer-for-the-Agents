name: windows-tpm-measured-boot
on:
  push:
  pull_request:
concurrency:
  group: windows-tpm-measured-boot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser-replay:
    name: parser-replay-linux-x64-self-hosted
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify measured-boot ABI and fail-closed boundary
        run: node scripts/windows-tpm-measured-boot-static.mjs
      - name: Verify read-only TBS collector boundary
        run: node scripts/windows-tpm-measured-boot-release.mjs
      - name: Verify platform-claim probe and PCR-binding boundary
        run: node scripts/windows-tpm-measured-boot-probe-release.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Test bounded WBCL parser, PCR replay and claim binding
        run: npm run test -w @cieav/api -- src/windows-tpm-measured-boot.test.ts src/windows-tpm-measured-boot-verifier.test.ts
      - name: Build API workspace dependencies
        run: |
          npm run build -w @cieav/contracts
          npm run build -w @cieav/core
      - name: Typecheck API measured-boot foundation
        run: npm run typecheck -w @cieav/api
      - name: Assert non-physical CI cannot qualify measured boot
        shell: bash
        run: |
          if grep -R -E 'measured.?boot.*verification[[:space:]]*:[[:space:]]*"VERIFIED"' apps/api/src scripts; then
            echo 'Measured-boot foundation must not expose VERIFIED before physical quote/log qualification'
            exit 1
          fi
          echo 'Measured-boot physical qualification remains unavailable on this non-physical Linux runner'

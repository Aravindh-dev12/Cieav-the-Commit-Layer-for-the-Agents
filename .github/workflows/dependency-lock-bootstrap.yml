name: dependency-lock-bootstrap

on:
  push:
    branches:
      - agent/credential-authority-production-hardening

permissions:
  contents: read

concurrency:
  group: dependency-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit resolved dependency graph
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify platform authority boundaries
        run: node scripts/platform-boundary-static.mjs
      - name: Verify OS-backed root secret boundary
        run: node scripts/os-secret-root-release.mjs
      - name: Verify OpenClaw zero-dependency consumer boundary
        run: node scripts/openclaw-no-deps-static.mjs
      - name: Verify Windows TPM/CNG native provider boundary
        run: node scripts/windows-tpm-cng-release.mjs
      - name: Verify live Windows TPM/MAA collector boundary
        run: node scripts/windows-tpm-maa-collector-release.mjs
      - name: Verify macOS Secure Enclave provider source boundary
        run: node scripts/macos-secure-enclave-release.mjs
      - name: Verify Linux PKCS11 provider boundary
        run: node scripts/linux-pkcs11-release.mjs
      - name: Verify CIEAV package namespace
        run: node scripts/package-namespace-smoke.mjs
      - name: Verify Python platform package
        run: |
          python -m pip install -e .
          python -m compileall -q python scripts/release-metadata-smoke.py
          python scripts/python-namespace-smoke.py
          python -m cieav_platform --help
          cieav --help
          cieav gateway --help
          cieav cloud --help
          cieav model --help
          cieav audit --help
          cieav audit tail --limit 5
          cieav companion --help
          cieav openclaw --help
          cieav openclaw connect --help
          cieav lab --help
          cieav a2a --help
          latch --help
          python scripts/platform-gateway-smoke.py
          python scripts/cloud-provider-smoke.py
          python scripts/local-model-smoke.py
          python scripts/hf-provider-smoke.py
          python scripts/release-metadata-smoke.py
          python - <<'PY'
          from pathlib import Path
          from cieav_platform.config import Settings
          s=Settings.load()
          assert s.root == Path.cwd().resolve()
          assert (s.root/'apps/browser/test-lab.html').exists()
          assert len(s.local_api_secret()) >= 32
          assert len(s.receipt_signing_secret()) >= 32
          assert s.local_api_secret() != s.receipt_signing_secret()
          print('CIEAV Python platform package passed')
          PY
      - name: Syntax-check execution and install boundary
        run: |
          node --check apps/browser/main.mjs
          node --check apps/browser/injected.js
          node --check apps/browser/audit.mjs
          node --check apps/a2a/src/index.mjs
          node --check apps/api/standalone.mjs
          node --check scripts/a2a-e2e.mjs
          node --check scripts/platform-boundary-static.mjs
          node --check scripts/os-secret-root-release.mjs
          node --check scripts/openclaw-no-deps-static.mjs
          node --check scripts/windows-tpm-cng-release.mjs
          node --check scripts/windows-tpm-maa-collector-release.mjs
          node --check scripts/macos-secure-enclave-release.mjs
          node --check scripts/linux-pkcs11-release.mjs
          node --check scripts/credential-hardware-admin-release.mjs
          node --check scripts/release-gate.mjs
          node --check scripts/agent-kernel-release.mjs
          node --check scripts/repository-governance-check.mjs
          node --check scripts/browser-e2e.mjs
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw 'distribution/install.ps1')) | Out-Null"
          sh -n distribution/install.sh
          if grep -q 'command -v python3\|python3 -' distribution/install.sh; then echo 'Unix consumer installer must not require Python'; exit 1; fi
          if grep -Eqi 'npm install|npx |pip install|pnpm add|yarn add' distribution/install.ps1; then echo 'PowerShell consumer installer must not require package managers'; exit 1; fi
      - name: Validate evaluation corpus and runners
        run: |
          node -e "const x=require('./evals/cases.v1.json'); if(!Array.isArray(x.cases)||x.cases.length<30) process.exit(1); const ids=x.cases.map(c=>c.id); if(new Set(ids).size!==ids.length) process.exit(2); console.log('eval cases:',x.cases.length)"
          node --check scripts/cieav-eval.mjs
          node --check scripts/latch-eval.mjs
          node --check scripts/compare-evals.mjs
      - name: Verify A2A governance boundary
        run: node scripts/a2a-e2e.mjs
      - name: Verify cognitive debt invariants
        run: node scripts/cognitive-debt-e2e.mjs
      - name: Verify Control Center reality dashboard
        run: node scripts/dashboard-reality-smoke.mjs
      - name: Verify no-install browser safety path
        run: |
          google-chrome --version || chromium --version
          node scripts/browser-e2e.mjs
          node scripts/noinstall-selftest.mjs
      - run: npm install
      - name: Audit Node dependency security
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Verify Gateway credential and hardware lifecycle
        run: node scripts/credential-hardware-admin-release.mjs
      - run: npm run build
      - name: Verify Agent Kernel authority, recovery, durability and proof settlement
        run: npm run test:agent-kernel
      - run: npm run test:ai-orchestration
      - run: npm run typecheck
      - run: npm run test:core

name: ml-gpu-static

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ml-gpu-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: ml-gpu-policy-linux-x64-self-hosted
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure runner system Python
        shell: bash
        run: |
          set -euxo pipefail
          PYTHON_BIN="$(command -v python3 || command -v python)"
          "$PYTHON_BIN" --version
          mkdir -p "$RUNNER_TEMP/cieav-bin"
          ln -sf "$PYTHON_BIN" "$RUNNER_TEMP/cieav-bin/python"
          echo "$RUNNER_TEMP/cieav-bin" >> "$GITHUB_PATH"
      - name: Verify ML GPU qualification boundary
        run: node scripts/ml-gpu-workflow-static.mjs
      - name: Verify ML reproducibility contract
        run: python scripts/ml-reproducibility-smoke.py

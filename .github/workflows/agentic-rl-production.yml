name: agentic-rl-production
on:
  push:
  pull_request:
concurrency:
  group: agentic-rl-production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundary:
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify model qualification and agentic RL boundary
        run: node scripts/agentic-rl-production-static.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build contracts and core
        run: npm run build -w @cieav/contracts && npm run build -w @cieav/core
      - name: Typecheck API
        run: npm run typecheck -w @cieav/api
      - name: Run model and agentic RL tests
        run: npm run test -w @cieav/api -- agentic-rl-evaluator.test.ts agentic-rl-environment.test.ts agentic-rl-suite.test.ts model-qualification-store.test.ts model-qualification-api.test.ts qualified-model-runtime.test.ts trusted-learning-materializer.test.ts learning-job-queue.test.ts
      - name: Run qualified model family scheduler tests
        run: npm run test -w @cieav/core -- consequence-intelligence.test.ts

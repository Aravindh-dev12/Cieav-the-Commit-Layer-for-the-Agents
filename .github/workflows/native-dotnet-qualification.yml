name: native-dotnet-qualification

on:
  push:
    branches:
      - main
    paths:
      - 'native/CMakeLists.txt'
      - 'native/include/**'
      - 'native/c/**'
      - 'native/cpp/**'
      - 'dotnet/**'
      - 'scripts/qualify-native-dotnet.mjs'
      - '.github/workflows/native-dotnet-qualification.yml'
  pull_request:
    paths:
      - 'native/CMakeLists.txt'
      - 'native/include/**'
      - 'native/c/**'
      - 'native/cpp/**'
      - 'dotnet/**'
      - 'scripts/qualify-native-dotnet.mjs'
      - '.github/workflows/native-dotnet-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: native-dotnet-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: native-dotnet-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Qualify C17/C++20 ABI and .NET 10 host
        run: node scripts/qualify-native-dotnet.mjs

      - name: Verify exact-head zero-authority receipt
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const p='release/reports/latest-native-dotnet-qualification.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(r.verdict!=='PASS') throw new Error('native/.NET receipt is not PASS');
          if(r.commit!==head) throw new Error(`receipt commit ${r.commit} != HEAD ${head}`);
          if(r.platform!==process.platform) throw new Error('receipt platform mismatch');
          if(r.authority!==false||r.mayMintExecutionAuthority!==false||r.executionAuthorityIssued!==false) throw new Error('native/.NET zero-authority invariant failed');
          if(!String(r.toolchain.dotnet||'').startsWith('10.')) throw new Error(`expected .NET 10, got ${r.toolchain.dotnet}`);
          console.log(`Native/.NET qualified ${process.platform}/${process.arch} at ${head}`);

      - name: Upload native/.NET qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dotnet-${{ matrix.name }}-${{ github.sha }}
          path: |
            release/reports/latest-native-dotnet-qualification.json
            release/reports/latest-native-dotnet-qualification.txt
          if-no-files-found: error
          retention-days: 30

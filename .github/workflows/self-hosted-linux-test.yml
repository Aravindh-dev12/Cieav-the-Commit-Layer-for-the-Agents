name: Self-hosted Linux Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Check runner
        run: |
          echo "Linux self-hosted runner works"
          uname -a
          whoami
          pwd
          node --version || true
          python3 --version || true
